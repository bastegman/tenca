# Dependabot: cada semana propone (en un pull request, nunca lo aplica solo) las versiones nuevas de las acciones de
# los workflows, que van fijadas por SHA con la versión en un comentario, y de requirements*.txt. Las alertas y los
# arreglos de seguridad están activados en Settings -> Code security. Los pull requests de Dependabot no reciben los
# secretos de Actions: el paso de agnosticismo con la lista privada se salta en ellos y lo avisa (tests.yml).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      acciones:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
