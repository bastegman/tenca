<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>{{APP_NAME}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/tenca.ico" sizes="16x16 20x20 24x24 32x32 40x40 48x48 64x64 128x128 256x256">
<link rel="icon" href="/tenca.png" type="image/png" sizes="256x256">
<link rel="apple-touch-icon" href="/tenca.png">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/hoy.css">
<link rel="preload" href="/manrope.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fraunces.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/"><img class="logo" src="/logo.svg" alt="">{{APP_NAME}}</a>
  <div class="gsearch">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="gq" placeholder="Buscar en todas las transcripciones…" autocomplete="off" spellcheck="false">
    <kbd>Ctrl K</kbd>
  </div>
  <button id="meetChip" class="meet-chip hidden" title="{{APP_NAME}} ha detectado que estás en una llamada"></button>
  <button id="btnSubir" class="subir-btn" title="Subir un audio que ya tengas: desde este PC o desde el móvil" aria-label="Subir audio" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg><span>Subir audio</span></button>
  <button id="btnRec" class="rec-btn" title="Grabar el audio del ordenador y el micrófono"><i class="recdot"></i><span>Grabar</span></button>
  <a id="liveChip" class="live-chip hidden" title="Hay una grabación en curso"><i class="recdot"></i>EN VIVO <span data-rec-clock></span></a>
  <button id="btnJobs" class="tb-btn" title="Cola de transcripciones">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
    <span>Cola</span><b id="jobsCount" class="badge hidden"></b>
  </button>
  <button id="btnSettings" class="tb-btn icon" title="Ajustes">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav class="side-nav" id="sideNav">
      <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>Hoy</a>
      <a href="#" data-nav="find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Buscar<kbd>Ctrl P</kbd></a>
      <a href="#/r/" data-nav="r"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M8 10v9"/></svg>Reuniones</a>
      <a href="#/c/" data-nav="c"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</a>
    </nav>
    <div class="side-tools">
      <input id="filter" placeholder="Filtrar carpetas y reuniones…" autocomplete="off" spellcheck="false">
      <button id="btnNewFolder" class="icon-btn" title="Nueva carpeta">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13h6"/></svg>
      </button>
    </div>
    <nav id="tree" class="tree"></nav>
    <div class="side-hint">Arrastra una reunión a una carpeta para moverla</div>
  </aside>
  <main id="main" class="main"></main>
</div>

<footer id="player" class="player hidden">
  <div class="p-controls">
    <button id="pBack" class="p-skip" title="−15 s  (Shift ←)">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><small>15</small>
    </button>
    <button id="pPlay" class="p-play" title="Reproducir / pausa  (Espacio)">
      <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>
    </button>
    <button id="pFwd" class="p-skip" title="+15 s  (Shift →)">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><small>15</small>
    </button>
  </div>
  <div class="p-info">
    <a id="pTitle" class="p-title"></a>
    <div class="p-bar">
      <span id="pCur">0:00</span>
      <input id="pSeek" type="range" min="0" max="1" step="any" value="0">
      <span id="pDur">0:00</span>
    </div>
  </div>
  <div class="p-speed" id="pSpeed" title="Velocidad de reproducción  ( [  ] )"></div>
</footer>

<div id="jobsPanel" class="popover hidden"></div>
<div id="modal" class="modal hidden"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<audio id="audio" preload="metadata"></audio>
<script src="/app.js"></script>
<script src="/notas.js"></script>
<script src="/voces.js"></script>
<script src="/aprender.js"></script>
<script src="/directo.js"></script>
<script src="/reunion.js"></script>
<script src="/hoy.js"></script>
<script src="/perfil.js"></script>
<script src="/modelos.js"></script>
<script src="/configurar.js"></script>
<script src="/nombres-audio.js"></script>
<script src="/grabar.js"></script>
<script src="/recibir.js"></script>
<script src="/ajustes.js"></script>
</body>
</html>
