name: lookfeel-e2e

# E2E real en Windows (main y las ramas del instalador): zip -> INSTALAR.bat en modo ventana (PowerShell 5.1, como en
# el PC del usuario) -> se instala en %USERPROFILE%\Tenca con su entrada de «Aplicaciones instaladas» -> la app abre
# su ventana con el titulo «Tenca» -> acceso directo -> Apagar -> reunion falsa -> segunda instalacion (la encuentra
# por «Aplicaciones instaladas») -> instalaciones disfrazadas de Chuleta, el nombre anterior (la encuentra por su
# entrada y por sus accesos directos, y no deja nada con ese nombre ni duplicado) -> instalacion que falla a proposito
# -> desinstalador: cancelado, con la app grabando, -Silencioso con la app abierta y, tras reinstalar, con «Borrar
# tambien mis ajustes» -> la Chuleta de verdad de main (CHULETA_SHA, la que tienen instalada) con su instalador y Tenca
# encima (fase v). La reunion se compara por sha256 en cada fase. Capturas de pantalla cada 5 s. Solo lee el repo;
# deja todo como artefacto.
on:
  workflow_dispatch:
  push:
    # main y las ramas de trabajo del instalador, solo cuando el push toca lo que va en el zip o lo que lo prueba (un
    # cambio de documentación no gasta los ~10 min de Windows). A mano: Actions -> lookfeel-e2e -> Run workflow.
    branches: [main, instalacion-empresa, tenca]
    paths:
      - "_app/**"
      - "INSTALAR.bat"
      - "ABRIR TENCA.bat"
      - "LEEME.txt"
      - "LICENSE"
      - "requirements.txt"
      - "scripts/build_zip.py"
      - "scripts/e2e/**"
      - "scripts/lookfeel_spike.py"
      - ".github/workflows/lookfeel-e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: La Chuleta de main para la fase v (Tenca encima de la version ya instalada)
        shell: bash
        run: git fetch --no-tags --depth=1 origin "$CHULETA_SHA"
        env:
          CHULETA_SHA: 2242e6332ea03285ede8e7f5d1b82e36aa5c0175
      - name: numpy (build_zip importa live.py)
        shell: powershell
        run: python -m pip install --disable-pip-version-check numpy
      - name: E2E (PowerShell 5.1)
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\e2e\lookfeel_e2e.ps1" -Repo "$env:GITHUB_WORKSPACE" -Out "$env:GITHUB_WORKSPACE\e2e-out" -Chuleta "2242e6332ea03285ede8e7f5d1b82e36aa5c0175"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: lookfeel-e2e
          path: e2e-out
          if-no-files-found: warn
