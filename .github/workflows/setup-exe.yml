name: setup-exe

# Setup.exe, fase 1 (ítem 8 del backlog): un asistente de Inno Setup que envuelve instalar.ps1. Se compila con el ISCC
# que traen los runners de Windows de GitHub (Inno Setup 6.7) y se prueba de verdad con PowerShell 5.1
# (scripts/e2e/setup_e2e.ps1): instalación nueva en silencio, el asistente pulsado como el usuario (UI Automation, con
# capturas), desinstalar, la Chuleta de main (CHULETA_SHA, la ya instalada) con el Setup encima y un fallo
# simulado. El Setup.exe (sin firma: Windows enseña SmartScreen) sale como artefacto «Tenca-Setup».
on:
  workflow_dispatch:
  push:
    branches: [main, setup-exe]
    paths:
      - "_app/**"
      - "INSTALAR.bat"
      - "ABRIR TENCA.bat"
      - "LEEME.txt"
      - "LICENSE"
      - "requirements.txt"
      - "scripts/build_zip.py"
      - "scripts/build_setup.py"
      - "scripts/setup/**"
      - "scripts/e2e/setup_e2e.ps1"
      - ".github/workflows/setup-exe.yml"

permissions:
  contents: read

jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: La Chuleta de main (para instalar el Setup encima)
        shell: bash
        run: git fetch --no-tags --depth=1 origin "$CHULETA_SHA"
        env:
          CHULETA_SHA: 2242e6332ea03285ede8e7f5d1b82e36aa5c0175
      - name: numpy (build_zip importa live.py)
        shell: powershell
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compilar Setup.exe (Inno Setup del runner)
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # la versión de Inno instalada en el runner (su entrada de Aplicaciones instaladas; la cabecera de ISCC no la dice)
          $inno = @(Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1", "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1" -ErrorAction SilentlyContinue)
          Write-Host ("Inno Setup " + $(if ($inno.Count) { $inno[0].DisplayVersion } else { "(sin entrada en el registro)" }) + " · ISCC " + (Get-Item -LiteralPath $iscc -ErrorAction SilentlyContinue).VersionInfo.FileVersion)
          python scripts\build_setup.py "$env:GITHUB_WORKSPACE\dist\Tenca - Setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: E2E del Setup.exe (PowerShell 5.1)
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\e2e\setup_e2e.ps1" -Setup "$env:GITHUB_WORKSPACE\dist\Tenca - Setup.exe" -Repo "$env:GITHUB_WORKSPACE" -Out "$env:GITHUB_WORKSPACE\setup-e2e-out" -Chuleta "2242e6332ea03285ede8e7f5d1b82e36aa5c0175"
          exit $LASTEXITCODE
      # el Setup.exe solo si ha pasado el E2E (un artefacto se descarga y se reparte); los registros, siempre
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: success()
        with:
          name: Tenca-Setup
          path: dist/Tenca - Setup.exe
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: setup-e2e
          path: setup-e2e-out
          if-no-files-found: warn
